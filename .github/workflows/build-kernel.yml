name: Build Kernel
on:
  push:
    branches: [custom-boost]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu device-tree-compiler build-essential
          aarch64-linux-gnu-gcc --version 2>&1 | head -1

      - name: Build
        run: |
          set -x
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH=$PATH:/usr/bin

          make clean || true
          make CC=${CROSS_COMPILE}gcc defconfig 2>&1
          make CC=${CROSS_COMPILE}gcc olddefconfig 2>&1
          make -j$(nproc) CC=${CROSS_COMPILE}gcc Image.gz 2>&1
        continue-on-error: true

      - name: Save logs
        if: always()
        run: |
          mkdir -p logs
          dmesg > logs/dmesg.txt 2>/dev/null || true
          find . -name "*.log" -o -name "*.err" | head -20
          ls -la

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /home/runner/work/_temp/_runner_file_commands/