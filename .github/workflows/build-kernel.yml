name: Build Kernel
on:
  push:
    branches: [custom-boost]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu device-tree-compiler

      - name: Build kernel
        id: build
        run: |
          # Export needed environment variables
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Clean previous builds
          make clean
          
          # Generate defconfig
          make CC=${CROSS_COMPILE}gcc defconfig
          
          # Check kernel config options
          echo "=== Valid kernel config options ==="
          
          # Check SCHED_WALT exists (from kernel/sched/walt/Kconfig)
          if grep -q "config SCHED_WALT" kernel/sched/walt/Kconfig 2>/dev/null; then
            echo "SCHED_WALT found in kernel/sched/walt/Kconfig"
            echo "CONFIG_SCHED_WALT=y" >> .config
          else
            echo "WARNING: SCHED_WALT not found in Kconfig"
          fi
          
          # Check UCLAMP exists (from init/Kconfig)
          if grep -q "config UCLAMP_TASK" init/Kconfig 2>/dev/null; then
            echo "UCLAMP_TASK found in init/Kconfig"
            echo "CONFIG_UCLAMP_TASK=y" >> .config
            echo "CONFIG_UCLAMP_TASK_GROUP=y" >> .config
            echo "CONFIG_UCLAMP_BUCKETS_COUNT=20" >> .config
          else
            echo "WARNING: UCLAMP_TASK not found in init/Kconfig"
          fi
          
          # Add other configs for gaming performance
          echo "CONFIG_CPU_IDLE_GOV_TEO=y" >> .config
          echo "CONFIG_CPU_IDLE_GOV_LADDER=y" >> .config
          echo "CONFIG_TCP_CONG_BBR=y" >> .config
          echo "CONFIG_CRYPTO_XXHASH=y" >> .config
          echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> .config
          
          # Try to find ZRAM_DEF_COMP_ZSTD in Kconfig files
          # Search through all Kconfig files for zstd-related configs
          ZRAM_CONFIG=$(grep -r "zstd" drivers/block/zram/Kconfig 2>/dev/null | head -1 || true)
          if [[ -n "$ZRAM_CONFIG" ]]; then
            echo "Found ZRAM zstd config: $ZRAM_CONFIG"
            echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> .config
          else
            echo "WARNING: ZRAM_DEF_COMP_ZSTD not found in Kconfig"
          fi
          
          # Run olddefconfig to process the new options
          echo "=== Regenerating defconfig ==="
          make CC=${CROSS_COMPILE}gcc olddefconfig
          
          # List applied configs
          echo "=== Applied configs ==="
          grep -E "^(CONFIG_SCHED_WALT|CONFIG_UCLAMP|CONFIG_CPU_IDLE|CONFIG_TCP|CONFIG_CRYPTO|CONFIG_BPF|CONFIG_ZRAM)" .config | head -20
          
          # Final build
          echo "=== Building Image.gz ==="
          make -j$(nproc) CC=${CROSS_COMPILE}gcc Image.gz

      - name: Upload Image.gz
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocof6-kernel-custom-boost-${{ github.run_number }}
          path: arch/arm64/boot/Image.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            /tmp/  # Logs would be here if we captured them
