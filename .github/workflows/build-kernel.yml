name: Build Kernel

on:
  push:
    branches: [ custom-boost ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev make \
            python3 git \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            libssl3

      - name: Build kernel (GKI)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Step 1: generate base config
          make CC=aarch64-linux-gnu-gcc defconfig

          # Step 2: merge vendor fragment
          scripts/kconfig/merge_config.sh .config arch/arm64/configs/vendor/peridot_GKI.config

          # Step 3: build Image.gz
          make -j$(nproc) CC=aarch64-linux-gnu-gcc Image.gz

      - name: Prepare release
        run: |
          mkdir -p release
          cp arch/arm64/boot/Image.gz release/
          echo "## Custom Kernel Build" > release/CHANGELOG.md
          echo "Branch: custom-boost" >> release/CHANGELOG.md
          echo "Features: WALT + UClamp + BFQ + BBR + ZRAM zstd" >> release/CHANGELOG.md
          echo "Date: $(date -u)" >> release/CHANGELOG.md
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-custom-boost-${{ github.run_number }}
          path: release/
          retention-days: 14
