name: Build Kernel
on:
  push:
    branches: [custom-boost]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc-aarch64-linux-gnu device-tree-compiler

      - name: Build
        run: |
          set -x
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make clean || true
          make CC=${CROSS_COMPILE}gcc defconfig

          # Apply custom boost configs
          echo "CONFIG_SCHED_WALT=y" >> .config
          echo "CONFIG_SCHED_WALT_DEBUG=m" >> .config
          echo "CONFIG_SCHED_CONSERVATIVE_BOOST_LPM_BIAS=y" >> .config
          echo "CONFIG_UCLAMP_TASK=y" >> .config
          echo "CONFIG_UCLAMP_TASK_GROUP=y" >> .config
          echo "CONFIG_UCLAMP_BUCKETS_COUNT=20" >> .config
          echo "CONFIG_CPU_IDLE_GOV_TEO=y" >> .config
          echo "CONFIG_CPU_IDLE_GOV_LADDER=y" >> .config
          echo "CONFIG_TCP_CONG_BBR=y" >> .config
          echo "CONFIG_CRYPTO_XXHASH=y" >> .config
          echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> .config
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> .config

          make CC=${CROSS_COMPILE}gcc olddefconfig
          make -j$(nproc) CC=${CROSS_COMPILE}gcc Image.gz

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image-custom-boost-${{ github.run_number }}
          path: arch/arm64/boot/Image.gz