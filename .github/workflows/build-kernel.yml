name: Build Kernel

on:
  push:
    branches: [ custom-boost ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev make \
            python3 git \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            libssl3

      - name: Build kernel (GKI)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Make clean
          make clean
          
          # Generate defconfig
          make CC=${CROSS_COMPILE}gcc defconfig
          
          # Apply custom configs manually (avoid merge_config.sh issues)
          cat >> .config << 'CONFIGEOF'
# Custom Boost Configs (via mjdevf)
CONFIG_SCHED_WALT=y
CONFIG_SCHED_WALT_DEBUG=m
CONFIG_SCHED_CONSERVATIVE_BOOST_LPM_BIAS=y
CONFIG_UCLAMP_TASK=y
CONFIG_UCLAMP_TASK_GROUP=y
CONFIG_UCLAMP_BUCKETS_COUNT=20
CONFIG_CPU_IDLE_GOV_TEO=y
CONFIG_CPU_IDLE_GOV_LADDER=y
CONFIG_MQ_IOSCHED_BFQ=y
CONFIG_TCP_CONG_BBR=y
CONFIG_ZRAM_DEF_COMP="zstd"
CONFIG_CRYPTO_XXHASH=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIGEOF
          
          # Regenerate Kconfig to resolve dependencies
          make CC=${CROSS_COMPILE}gcc olddefconfig
          
          # Build Image.gz
          make -j$(nproc) CC=${CROSS_COMPILE}gcc Image.gz

      - name: Prepare release
        run: |
          mkdir -p release
          cp arch/arm64/boot/Image.gz release/
          echo "## Custom Kernel Build" > release/CHANGELOG.md
          echo "Branch: custom-boost" >> release/CHANGELOG.md
          echo "Features: WALT + UClamp + BFQ + BBR + ZRAM zstd" >> release/CHANGELOG.md
          echo "Date: $(date -u)" >> release/CHANGELOG.md
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-custom-boost-${{ github.run_number }}
          path: release/
          retention-days: 14